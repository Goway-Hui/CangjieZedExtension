[workspace]
members = [
    ".",
    "proxy"
]

[package]
name = "cangjie-extension"
version = "1.0.5"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
percent-encoding = "2.3"

[dev-dependencies]
tree-sitter = "0.25"
tree-sitter-cangjie = { path = "grammars/cangjie/bindings/rust" }
insta = { version = "1.46", features = ["yaml"] }
